# Self-test + release pipeline for utem-gitlab-template
#
# This pipeline is meant to run on gitlab.com (see RUNBOOK.md). It:
#   1. validates the component YAML + spec:inputs header,
#   2. lints and unit-tests the scan script against a mocked UTEM API,
#   3. on a semver tag, publishes the component to the GitLab CI/CD Catalog
#      via a release (release-cli). Non-tag pipelines NEVER release.

stages:
  - validate
  - lint
  - test
  - release

# ── Validate YAML syntax (both documents of the component) ──────────────────
validate-template:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache python3 py3-pip >/dev/null 2>&1
    - pip3 install --quiet --break-system-packages yamllint 2>/dev/null || pip3 install --quiet yamllint 2>/dev/null || true
  script:
    - echo "Validating YAML syntax..."
    - |
      if command -v yamllint >/dev/null 2>&1; then
        yamllint -d "{extends: default, rules: {line-length: {max: 200}, truthy: disable, comments-indentation: disable, document-start: disable}}" templates/utem-scan.yml .gitlab-ci.yml
        echo "YAML lint passed."
      else
        echo "yamllint not available — falling back to python YAML parser."
        python3 -c "
      import yaml, sys
      # templates/utem-scan.yml is a TWO-document file (spec --- config), so
      # use safe_load_all; .gitlab-ci.yml is single-document.
      for f in ['templates/utem-scan.yml', '.gitlab-ci.yml']:
          try:
              docs = list(yaml.safe_load_all(open(f)))
              print(f'{f}: valid YAML ({len(docs)} document(s))')
          except yaml.YAMLError as e:
              print(f'{f}: INVALID — {e}', file=sys.stderr)
              sys.exit(1)
      "
      fi
  rules:
    - changes:
        - templates/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Validate the CI/CD Component spec:inputs header ─────────────────────────
# A catalog component MUST have a parseable `spec.inputs` header whose defaults
# are present and self-consistent. This asserts the component contract without
# needing a live GitLab runner to resolve `include: component:`.
validate-component-spec:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache python3 >/dev/null 2>&1
  script:
    - echo "Validating component spec:inputs header..."
    - python3 tests/validate_component_spec.py
  rules:
    - changes:
        - templates/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Lint shell script ────────────────────────────────────────────────────────
lint-script:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash shellcheck >/dev/null 2>&1 || true
  script:
    - echo "Linting utem-scan.sh..."
    - |
      if command -v shellcheck >/dev/null 2>&1; then
        shellcheck -s bash -S warning scripts/utem-scan.sh
        echo "shellcheck passed."
      else
        echo "shellcheck not available — running bash syntax check."
        bash -n scripts/utem-scan.sh
        echo "bash -n syntax check passed."
      fi
    - echo "Checking script is executable..."
    - test -x scripts/utem-scan.sh || echo "WARNING: scripts/utem-scan.sh is not executable (chmod +x)"
  rules:
    - changes:
        - scripts/**/*
    - if: $CI_COMMIT_TAG

# ── Verify required files exist ─────────────────────────────────────────────
verify-structure:
  stage: validate
  image: alpine:3.20
  script:
    - echo "Verifying project structure..."
    - |
      exit_code=0
      for f in templates/utem-scan.yml scripts/utem-scan.sh tests/test_utem_scan.sh README.md LICENSE CHANGELOG.md RUNBOOK.md; do
        if [ -f "$f" ]; then
          echo "  OK   $f"
        else
          echo "  MISSING  $f"
          exit_code=1
        fi
      done
      exit $exit_code
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Dry-run: verify script loads without errors ─────────────────────────────
dry-run:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq bash >/dev/null 2>&1
  script:
    - echo "Running dry-run (no API key = expected failure at validation)..."
    - |
      # The script should fail with a clear error about missing UTEM_API_KEY
      set +e
      output=$(bash scripts/utem-scan.sh 2>&1)
      rc=$?
      set -e

      if [ $rc -eq 1 ] && echo "$output" | grep -q "UTEM_API_KEY is not set"; then
        echo "Dry-run passed: script correctly requires UTEM_API_KEY."
      else
        echo "Dry-run failed: unexpected behavior."
        echo "$output"
        exit 1
      fi
  rules:
    - changes:
        - scripts/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Unit tests: exercise script logic against a mocked UTEM API ────────────
unit-tests:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq python3 >/dev/null 2>&1
  script:
    - bash tests/test_utem_scan.sh
  rules:
    - changes:
        - scripts/**/*
        - tests/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Publish to the GitLab CI/CD Catalog (semver tag only) ───────────────────
# Requires: project hosted on gitlab.com + "CI/CD Catalog resource" enabled
# (see RUNBOOK.md). The `release` keyword creates a GitLab release; for a
# catalog project that release publishes this component version to the catalog.
# The rule matches ONLY semantic-version tags, so branch/MR/schedule pipelines
# never release. Runs in the last stage, so it is gated by the test stages above.
create-catalog-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  script:
    - echo "Publishing UTEM security-scan CI/CD component ${CI_COMMIT_TAG} to the catalog."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "UTEM security-scan component $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of the UTEM GitLab CI/CD security-scan component. See CHANGELOG.md for details."
