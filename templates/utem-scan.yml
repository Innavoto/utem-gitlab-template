# UTEM Security Scanning Template for GitLab CI/CD
# Publisher: Innavoto India Pvt Ltd
# https://utem.innavoto.com
#
# Usage:
#   include:
#     - project: 'Innavoto/utem-gitlab-template'
#       file: '/templates/utem-scan.yml'
#
# Required CI/CD variable:
#   UTEM_API_KEY — set in GitLab → Settings → CI/CD → Variables (masked)

variables:
  UTEM_BASE_URL: "https://utem.innavoto.com"
  UTEM_TENANT_ID: "1"
  UTEM_SCAN_TYPE: "code"
  UTEM_SEVERITY_THRESHOLD: "high"
  UTEM_FAIL_ON_FINDINGS: "true"
  UTEM_TIMEOUT: "300"
  UTEM_MODULES: ""

.utem-scan:
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq bash >/dev/null 2>&1
  script:
    - |
      if [ -f "${CI_PROJECT_DIR}/scripts/utem-scan.sh" ]; then
        bash "${CI_PROJECT_DIR}/scripts/utem-scan.sh"
      else
        bash <(curl -fsSL https://raw.githubusercontent.com/Innavoto/utem-gitlab-template/main/scripts/utem-scan.sh)
      fi
  artifacts:
    reports:
      junit: utem-results.xml
    paths:
      - utem-results.json
      - utem-results.xml
      - utem-summary.txt
    when: always
    expire_in: 30 days

# ──────────────────────────────────────────────────
# Code scan — runs on MR events and default branch
# ──────────────────────────────────────────────────
utem-code-scan:
  extends: .utem-scan
  stage: test
  variables:
    UTEM_SCAN_TYPE: "code"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ──────────────────────────────────────────────────
# Full scan — manual trigger on default branch
# ──────────────────────────────────────────────────
utem-full-scan:
  extends: .utem-scan
  stage: test
  variables:
    UTEM_SCAN_TYPE: "full"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ──────────────────────────────────────────────────
# SBOM scan — generates software bill of materials
# ──────────────────────────────────────────────────
utem-sbom-scan:
  extends: .utem-scan
  stage: test
  variables:
    UTEM_SCAN_TYPE: "sbom"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ──────────────────────────────────────────────────
# Scheduled nightly scan
# ──────────────────────────────────────────────────
utem-scheduled-scan:
  extends: .utem-scan
  stage: test
  variables:
    UTEM_SCAN_TYPE: "full"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
